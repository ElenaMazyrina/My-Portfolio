<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <style>
        .bg     { fill: #131008; }
        .letter { fill: #131008; }
        .spark  { fill: #6B8FFF; }
    </style>

    <!-- rounded square background -->
    <rect width="32" height="32" rx="7" class="bg"/>

    <!-- yellow blob highlight -->
    <ellipse cx="14" cy="16" rx="11" ry="10"
             fill="#FAC800"
             transform="rotate(-8 14 16)"/>

    <!-- letter Е -->
    <text x="15" y="23"
          text-anchor="middle"
          font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
          font-weight="900"
          font-size="19"
          class="letter">Е</text>

    <!-- tiny sparkle top-right -->
    <path d="M27 5 L27.9 8.1 L31 9 L27.9 9.9 L27 13 L26.1 9.9 L23 9 L26.1 8.1 Z"
          class="spark" transform="scale(0.55) translate(22 -2)"/>
</svg>

